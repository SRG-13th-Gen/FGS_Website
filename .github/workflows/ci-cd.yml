name: Deploy preview

on:
  push:
    branches: [staging]

permissions:
  contents: read

concurrency:
  group: hostinger-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 20
    env:
      HOSTINGER_ACCOUNT_USERNAME: ${{ vars.HOSTINGER_ACCOUNT_USERNAME }}
      HOSTINGER_PREVIEW_DOMAIN: ${{ vars.HOSTINGER_PREVIEW_DOMAIN }}

    steps:
      - name: Check out merged staging commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify preview target and required configuration
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/staging" ]]
          [[ "$HOSTINGER_ACCOUNT_USERNAME" == "u414393871" ]]
          [[ "$HOSTINGER_PREVIEW_DOMAIN" == "preview.flordegraceschoolinc.com" ]]
          [[ -n "$HOSTINGER_API_TOKEN" ]]

      - name: Package the exact merged commit
        run: |
          set -euo pipefail
          archive="fgs-staging-${GITHUB_SHA}.zip"
          git archive --format=zip --output="$RUNNER_TEMP/$archive" "$GITHUB_SHA"
          test -s "$RUNNER_TEMP/$archive"
          echo "ARCHIVE_NAME=$archive" >> "$GITHUB_ENV"

      - name: Upload source archive through Hostinger API
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        run: |
          set -euo pipefail
          jq -n --arg username "$HOSTINGER_ACCOUNT_USERNAME" --arg domain "$HOSTINGER_PREVIEW_DOMAIN" \
            '{username: $username, domain: $domain}' > "$RUNNER_TEMP/upload-url-request.json"
          curl --fail --silent --show-error --connect-timeout 15 --max-time 60 \
            --header "Authorization: Bearer $HOSTINGER_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/upload-url-request.json" \
            "https://developers.hostinger.com/api/hosting/v1/files/upload-urls" \
            > "$RUNNER_TEMP/upload-url-response.json"
          upload_url=$(jq -er '.url // .data.url // empty' "$RUNNER_TEMP/upload-url-response.json")
          auth_key=$(jq -er '.auth_key // .data.auth_key // empty' "$RUNNER_TEMP/upload-url-response.json")
          rest_auth_key=$(jq -er '.rest_auth_key // .data.rest_auth_key // empty' "$RUNNER_TEMP/upload-url-response.json")
          [[ "$upload_url" == https://* ]]
          upload_target="${upload_url%/}/${ARCHIVE_NAME}?override=true"
          archive_path="$RUNNER_TEMP/$ARCHIVE_NAME"
          archive_size=$(stat -c %s "$archive_path")
          create_status=$(curl --silent --show-error --connect-timeout 15 --max-time 60 \
            --output "$RUNNER_TEMP/upload-create-response" --write-out '%{http_code}' \
            --request POST --header "X-Auth: $auth_key" --header "X-Auth-Rest: $rest_auth_key" \
            --header 'Tus-Resumable: 1.0.0' --header "Upload-Length: $archive_size" \
            --header 'Upload-Offset: 0' "$upload_target")
          [[ "$create_status" == 201 ]] || { echo "Upload creation failed (HTTP $create_status)." >&2; exit 1; }
          upload_status=$(curl --silent --show-error --connect-timeout 15 --max-time 300 \
            --dump-header "$RUNNER_TEMP/upload-headers" \
            --output "$RUNNER_TEMP/upload-patch-response" --write-out '%{http_code}' \
            --request PATCH --header "X-Auth: $auth_key" --header "X-Auth-Rest: $rest_auth_key" \
            --header 'Tus-Resumable: 1.0.0' \
            --header 'Content-Type: application/offset+octet-stream' --header 'Upload-Offset: 0' \
            --data-binary "@$archive_path" "$upload_target")
          [[ "$upload_status" == 204 ]] || { echo "Archive upload failed (HTTP $upload_status)." >&2; exit 1; }
          uploaded_size=$(tr -d '\r' < "$RUNNER_TEMP/upload-headers" |
            awk -F': ' 'tolower($1) == "upload-offset" {print $2}' | tail -n 1)
          [[ "$uploaded_size" == "$archive_size" ]] || { echo 'Archive upload size was not confirmed.' >&2; exit 1; }

      - name: Confirm Hostinger can read the archive
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        run: |
          set -euo pipefail
          api="https://developers.hostinger.com/api/hosting/v1/accounts/$HOSTINGER_ACCOUNT_USERNAME/websites/$HOSTINGER_PREVIEW_DOMAIN/nodejs/builds"
          curl --fail-with-body --silent --show-error --get \
            --header "Authorization: Bearer $HOSTINGER_API_TOKEN" \
            --data-urlencode "archive_path=$ARCHIVE_NAME" \
            "$api/settings/from-archive" > "$RUNNER_TEMP/archive-settings.json"

      - name: Build and publish preview with Hostinger
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        run: |
          set -euo pipefail
          api="https://developers.hostinger.com/api/hosting/v1/accounts/$HOSTINGER_ACCOUNT_USERNAME/websites/$HOSTINGER_PREVIEW_DOMAIN/nodejs/builds"
          jq -n --arg archive "$ARCHIVE_NAME" '{
            node_version: 24,
            app_type: "next",
            root_directory: ".",
            output_directory: ".next",
            build_script: "build",
            package_manager: "pnpm",
            source_type: "archive",
            source_options: {archive_path: $archive}
          }' > "$RUNNER_TEMP/build-request.json"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $HOSTINGER_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/build-request.json" \
            "$api" > "$RUNNER_TEMP/build-response.json"
          build_id=$(jq -r '.uuid // .data.uuid // empty' "$RUNNER_TEMP/build-response.json")
          [[ -n "$build_id" ]] || { echo 'Hostinger did not return a build ID.' >&2; exit 1; }
          echo "Hostinger build: $build_id"
          for attempt in {1..60}; do
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $HOSTINGER_API_TOKEN" \
              "$api/$build_id" > "$RUNNER_TEMP/build-status.json"
            state=$(jq -r '.state // .data.state // empty' "$RUNNER_TEMP/build-status.json")
            case "$state" in
              completed) echo 'Preview deployment completed.'; exit 0 ;;
              failed) echo "Hostinger build $build_id failed. Check its build logs in hPanel." >&2; exit 1 ;;
              pending|running) sleep 15 ;;
              *) echo "Unexpected Hostinger build state: $state" >&2; exit 1 ;;
            esac
          done
          echo "Hostinger build $build_id did not finish within 15 minutes." >&2
          exit 1

name: fgs-website-local

services:
  database:
    image: mariadb:11.8.9@sha256:79d59758afc91b89b120b0a8904d637f5a3b3e1c4900f29b740d6d46c72fef68
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-wordpress}
      MARIADB_USER: ${MARIADB_USER:-wordpress}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Run pnpm setup:env first}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Run pnpm setup:env first}
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  wordpress:
    image: wordpress:7.1.1-php8.3-apache@sha256:51464c8fdb100c5cd2ebfaec1834cf111d993bc4929ef2330c1cc721eda0fc30
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WORDPRESS_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: ${MARIADB_DATABASE:-wordpress}
      WORDPRESS_DB_USER: ${MARIADB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MARIADB_PASSWORD:?Run pnpm setup:env first}
      LOCAL_WORDPRESS_URL: ${WORDPRESS_URL:-http://localhost:8080}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WP_HOME', getenv('LOCAL_WORDPRESS_URL'));
        define('WP_SITEURL', getenv('LOCAL_WORDPRESS_URL'));
        define('DISALLOW_FILE_EDIT', true);
    volumes:
      - wordpress_data:/var/www/html
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/zz-uploads.ini:ro
      - ./wordpress/mu-plugins:/var/www/html/wp-content/mu-plugins:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "exit(@fsockopen('127.0.0.1', 80) === false ? 1 : 0);"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  database_data:
  wordpress_data:

name: fgs-website-content-local
services:
  database:
    image: mariadb:11.8.9@sha256:79d59758afc91b89b120b0a8904d637f5a3b3e1c4900f29b740d6d46c72fef68
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    environment:
      MARIADB_DATABASE: ${DB_NAME:-fgs_content}
      MARIADB_USER: ${DB_USER:-fgs_content}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Run pnpm setup:env first}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Run pnpm setup:env first}
    volumes:
      - content_database_data:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
volumes:
  content_database_data:

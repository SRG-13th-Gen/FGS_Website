; Local-only override, mounted read-only into the WordPress container.
; Raises PHP upload limits above SPEC-003's 10 MB per-image cap so local
; admin publishing can be exercised end-to-end. Default WordPress/PHP image
; ships with upload_max_filesize=2M / post_max_size=8M, both too small.
; Not evidence of any production PHP configuration (DEC-107 unverified).
upload_max_filesize = 12M
post_max_size = 24M
memory_limit = 256M
